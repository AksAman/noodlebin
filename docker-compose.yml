services:
  postgres:
    image: postgres:15
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodevault
    volumes:
      - nodevault-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodevault"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  nodevault-pg:
