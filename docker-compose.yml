services:
  postgres:
    image: postgres:15
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noodlebin
    volumes:
      - noodlebin-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noodlebin"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  noodlebin-pg:
