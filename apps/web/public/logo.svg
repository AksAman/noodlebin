<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 16">
  <title>noodlebin</title>
  <style>
    .shader { stroke: #409d48; }
    .accent { fill: #f38230; }
    .bin { fill: none; stroke: #0f9b89; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .shader { stroke: #68c36d; }
      .bin { stroke: #52c8b4; }
    }
  </style>
  <!-- noodle link -->
  <path
    class="shader"
    d="M4.5 4.5C13 4.5 15 11.5 23 11.5"
    fill="none"
    stroke="#409d48"
    stroke-width="2"
    stroke-linecap="round"
  />
  <!-- output socket dot (orange) -->
  <circle class="accent" cx="4.5" cy="4.5" r="3" fill="#f38230" />
  <!-- bin: open-top rectangle -->
  <path class="bin" d="M21 9.5h6v5h-6z" stroke="#0f9b89" />
  <!-- bin lid outline -->
  <path class="bin" d="M20 9.5h8" stroke="#0f9b89" />
  <!-- noodle drops into bin center -->
</svg>
