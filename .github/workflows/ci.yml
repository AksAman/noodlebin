# Public PRs run only on GitHub-hosted VMs (no Blender, no self-hosted).
# The Blender runner is for push to master/main and published releases only.
# Do not add pull_request_target.
name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run --filter @noodlebin/web build
      - run: python3 -m unittest discover -s addon/tests -t .

  blender:
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    needs: test
    runs-on: [self-hosted, linux, blender]
    permissions:
      contents: ${{ github.event_name == 'release' && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Blender binaries
        id: blender
        run: |
          set -euo pipefail
          B52="${BLENDER_52:-$HOME/blender/blender-5.2.2-linux-x64/blender}"
          B51="${BLENDER_51:-$HOME/blender/blender-5.1.0-linux-x64/blender}"
          test -x "$B52"
          test -x "$B51"
          echo "b52=$B52" >> "$GITHUB_OUTPUT"
          echo "b51=$B51" >> "$GITHUB_OUTPUT"
          "$B52" --version | head -1
          "$B51" --version | head -1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: python3 -m unittest discover -s addon/tests -t .

      - name: Blender 5.1 capture + paste
        run: |
          "${{ steps.blender.outputs.b51 }}" --background --factory-startup --python addon/tests/blender_capture_test.py
          "${{ steps.blender.outputs.b51 }}" --background --factory-startup --python addon/tests/blender_paste_test.py

      - name: Blender 5.2 capture + paste
        run: |
          "${{ steps.blender.outputs.b52 }}" --background --factory-startup --python addon/tests/blender_capture_test.py
          "${{ steps.blender.outputs.b52 }}" --background --factory-startup --python addon/tests/blender_paste_test.py

      - name: Validate extension
        run: |
          "${{ steps.blender.outputs.b52 }}" --command extension validate --source-dir addon

      - name: Package extension
        run: |
          python3 scripts/build_addon.py \
            --blender "${{ steps.blender.outputs.b52 }}"

      - uses: actions/upload-artifact@v4
        with:
          name: noodlebin-addon
          path: dist/noodlebin-*.zip

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/noodlebin-*.zip --clobber
